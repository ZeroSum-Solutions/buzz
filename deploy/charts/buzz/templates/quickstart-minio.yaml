{{- /*
Eval-only in-cluster MinIO for the quickstart profile. NOT for production —
single replica, no TLS, credentials from the chart-managed Secret. Production
deploys leave minio.enabled=false and point s3.* at managed object storage.
*/ -}}
{{- if .Values.minio.enabled -}}
{{- if .Values.secrets.existingSecret -}}
{{- fail "minio.enabled=true (quickstart) is incompatible with secrets.existingSecret. Quickstart autogenerates MinIO credentials in the chart-managed Secret; for external S3 set minio.enabled=false and provide BUZZ_S3_ACCESS_KEY/BUZZ_S3_SECRET_KEY." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buzz.minioFullname" . }}
  labels:
    {{- include "buzz.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "buzz.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "buzz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      {{- with .Values.minio.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.minio.fixDataOwnership }}
      initContainers:
        # Volumes written by the old root-run minio/minio image are root-owned,
        # and fsGroup does not fix hostPath-backed PVCs. Hand them over to the
        # nonroot uid. The walk is skipped once nothing is left to change, so a
        # reschedule costs one find; files that vanish mid-walk are tolerated
        # and only ownership still wrong afterwards fails the pod.
        - name: data-ownership
          image: {{ .Values.minio.image | quote }}
          command:
            - /bin/sh
            - -c
            - |
              # Vanished entries ("No such file") are expected while MinIO serves;
              # any other find error means /data could not be checked.
              scan() {
                out="$(find /data -xdev ! -user 65532 -print -quit 2>&1)"
                bad="$(printf '%s\n' "$out" | grep '^find: ' | grep -v 'No such file or directory')"
                [ -z "$bad" ] || { echo "data-ownership: cannot scan /data: $bad" >&2; exit 1; }
                printf '%s\n' "$out" | grep '^/' | head -n 1
              }
              first="$(scan)" || exit 1
              [ -z "$first" ] && exit 0
              chown -R 65532:65532 /data || true
              left="$(scan)" || exit 1
              [ -z "$left" ] && exit 0
              echo "data-ownership: $left is not owned by 65532 (set minio.fixDataOwnership=false if the storage rejects root chown)" >&2
              exit 1
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - { name: data, mountPath: /data }
      {{- end }}
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "buzz.chartSecretName" . }}
                  key: BUZZ_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "buzz.chartSecretName" . }}
                  key: BUZZ_S3_SECRET_KEY
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: api }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "buzz.minioFullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "buzz.minioFullname" . }}
  labels:
    {{- include "buzz.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    {{- include "buzz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
  ports:
    - { name: api, port: 9000, targetPort: api }
    - { name: console, port: 9001, targetPort: console }
{{- if .Values.minio.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "buzz.minioFullname" . }}
  labels:
    {{- include "buzz.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size | quote }}
{{- end }}
{{- end -}}
